<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520">
<style>text{font-family:Arial,sans-serif;fill:#111}.board{fill:#f7f7f7;stroke:#111;stroke-width:3}.part{fill:white;stroke:#111;stroke-width:2}.keep{fill:none;stroke:#666;stroke-width:2;stroke-dasharray:9 7}.dim{font-size:16px}.lab{font-size:18px}.title{font-size:25px;font-weight:bold}</style>
<text x="35" y="42" class="title">MA600A RefWinch Encoder — nominal placement, component side</text>
<!-- scale 35px/mm; board 28x12 -->
<rect x="70" y="75" width="980" height="420" rx="8" class="board"/>
<!-- U1 at 4,6 -->
<rect x="192.5" y="267.5" width="105" height="105" class="part"/><text x="213" y="325" class="lab">U1</text><text x="195" y="348" class="dim">MA600A</text>
<circle cx="210" cy="285" r="175" class="keep"/><text x="84" y="120" class="dim">5 mm magnetic keepout</text>
<!-- C3 C4 -->
<rect x="410" y="220" width="55" height="28" class="part"/><text x="417" y="240" class="dim">C3</text>
<rect x="410" y="355" width="55" height="28" class="part"/><text x="417" y="375" class="dim">C4</text>
<!-- U2 -->
<rect x="535" y="270" width="80" height="65" class="part"/><text x="557" y="308" class="lab">U2</text>
<!-- caps -->
<rect x="525" y="157" width="72" height="34" class="part"/><text x="544" y="180" class="dim">C1</text>
<rect x="525" y="410" width="72" height="34" class="part"/><text x="544" y="433" class="dim">C2</text>
<!-- test pads -->
<g><circle cx="710" cy="250" r="10" class="part"/><circle cx="745" cy="250" r="10" class="part"/><circle cx="780" cy="250" r="10" class="part"/><circle cx="815" cy="250" r="10" class="part"/><circle cx="850" cy="250" r="10" class="part"/><circle cx="885" cy="250" r="10" class="part"/><circle cx="920" cy="250" r="10" class="part"/><text x="715" y="290" class="dim">production / SPI pogo pads</text></g>
<!-- J1 -->
<rect x="845" y="315" width="165" height="90" class="part"/><text x="900" y="350" class="lab">J1</text><text x="865" y="380" class="dim">JST-GH 6</text>
<text x="80" y="475" class="dim">Board: 28 x 12 mm nominal. Cable exits away from sensor. No screw/mounting metal near U1.</text>
</svg>
