<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660">
<style>
text{font-family:Arial,sans-serif;fill:#111} .box{fill:white;stroke:#111;stroke-width:2}.wire{fill:none;stroke:#111;stroke-width:2}.thin{stroke-width:1.4}.label{font-size:18px}.small{font-size:14px}.title{font-size:26px;font-weight:bold}.note{font-size:15px}
</style>
<text x="40" y="45" class="title">MA600A RefWinch Encoder — v0.1 schematic</text>
<rect x="60" y="150" width="175" height="260" rx="8" class="box"/>
<text x="90" y="180" class="label">J1 JST-GH 6</text>
<text x="80" y="220" class="small">1 GND</text><text x="80" y="255" class="small">2 +5V</text><text x="80" y="290" class="small">3 A</text><text x="80" y="325" class="small">4 B</text><text x="80" y="360" class="small">5 Z</text><text x="80" y="395" class="small">6 RSV / NC</text>
<rect x="390" y="170" width="180" height="170" rx="8" class="box"/>
<text x="420" y="205" class="label">U2 MP20056</text><text x="438" y="230" class="small">GJ-33</text>
<text x="405" y="270" class="small">VIN 1</text><text x="405" y="305" class="small">EN 3</text><text x="510" y="270" class="small">5 VOUT</text><text x="510" y="305" class="small">4 FB NC</text><text x="445" y="330" class="small">2 GND</text>
<rect x="760" y="120" width="230" height="350" rx="8" class="box"/>
<text x="820" y="155" class="label">U1 MA600A</text>
<text x="780" y="205" class="small">14 AVDD</text><text x="780" y="235" class="small">13 DVDD</text><text x="780" y="275" class="small">8 GND</text><text x="780" y="305" class="small">10 TEST</text>
<text x="900" y="205" class="small">2 IO2 → A</text><text x="900" y="235" class="small">6 IO4 → B</text><text x="900" y="265" class="small">3 IO3 → Z</text>
<text x="900" y="320" class="small">5 /CS</text><text x="900" y="350" class="small">12 SCLK</text><text x="900" y="380" class="small">4 COPI</text><text x="900" y="410" class="small">7 CIPO</text>
<text x="780" y="445" class="small">EP17 = NC / float</text>
<!-- Power -->
<path d="M235 250 H390" class="wire"/><text x="280" y="242" class="small">+5V</text>
<path d="M390 290 H350 V250" class="wire thin"/><text x="330" y="315" class="small">EN tied to VIN</text>
<path d="M570 250 H700 V205 H760" class="wire"/><text x="615" y="242" class="small">+3V3</text>
<!-- Grounds -->
<path d="M235 215 H300 V520 H760 V275" class="wire"/><text x="310" y="512" class="small">GND</text>
<path d="M480 340 V520" class="wire"/><path d="M760 305 H730 V520" class="wire"/>
<!-- ABZ -->
<path d="M990 205 H1060 V290 H235" class="wire"/><path d="M990 235 H1080 V325 H235" class="wire"/><path d="M990 265 H1100 V360 H235" class="wire"/>
<!-- caps -->
<rect x="620" y="90" width="85" height="35" class="box"/><text x="630" y="113" class="small">C3 1uF</text><path d="M662 125 V205" class="wire thin"/>
<rect x="620" y="355" width="95" height="35" class="box"/><text x="628" y="378" class="small">C4 0.1uF</text><path d="M667 355 V235" class="wire thin"/>
<text x="595" y="430" class="note">C3/C4 placed ≥5 mm from sensor center</text>
<!-- LDO caps -->
<rect x="285" y="110" width="100" height="35" class="box"/><text x="300" y="133" class="small">C1 2.2uF</text><path d="M335 145 V250" class="wire thin"/>
<rect x="585" y="275" width="100" height="35" class="box"/><text x="600" y="298" class="small">C2 4.7uF</text><path d="M635 275 V250" class="wire thin"/>
<!-- SPI pads -->
<rect x="1030" y="395" width="135" height="155" rx="8" class="box"/><text x="1050" y="425" class="label">Pogo pads</text><text x="1050" y="455" class="small">/CS</text><text x="1050" y="480" class="small">SCLK</text><text x="1050" y="505" class="small">COPI</text><text x="1050" y="530" class="small">CIPO</text>
<path d="M990 320 H1040 V455" class="wire thin"/><path d="M990 350 H1025 V480 H1040" class="wire thin"/><path d="M990 380 H1010 V505 H1040" class="wire thin"/><path d="M990 410 H995 V530 H1040" class="wire thin"/>
<text x="60" y="610" class="note">Default MA600A: IO2=A, IO4=B, IO3=Z; 512 PPR. No MCU or level shifter.</text>
</svg>
